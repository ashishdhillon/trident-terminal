[package]
name = "trident-desktop"
version = "3.0.0"
description = "Trident Terminal native macOS menu-bar & desktop C2 app (Tauri v2)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
